name: Build Pusaka Rinjani Windows

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Compress Release Folder
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Pusaka-Rinjani-Windows.zip" -Force

      - name: Upload Pusaka Rinjani Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pusaka-Rinjani-Windows
          path: build/windows/x64/runner/Release

      - name: Publish/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Pusaka Rinjani - Latest Release"
          body: |
            Build otomatis terbaru dari branch `master`.
            Tanggal build: ${{ github.event.head_commit.timestamp || 'N/A' }}
            Commit: ${{ github.sha }}
          files: Pusaka-Rinjani-Windows.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}