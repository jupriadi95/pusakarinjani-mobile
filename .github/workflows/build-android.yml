name: Build Pusaka Rinjani Android APK

on:
  # push:
  #   branches:
  #     - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (Release)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android APK Release
        run: flutter build apk --release

      - name: Copy Renamed APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Pusaka-Rinjani-Android.apk

      - name: Upload Pusaka Rinjani Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pusaka-Rinjani-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Pusaka Rinjani - Latest Release"
          body: |
            Build otomatis terbaru dari branch `master`.
            Tanggal build: ${{ github.event.head_commit.timestamp || 'N/A' }}
            Commit: ${{ github.sha }}
          files: Pusaka-Rinjani-Android.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
